[package]
name = "openbitfun-updater-lab"
version = "0.2.19"
edition = "2021"
publish = false

# Deliberately independent of the large product workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.6.3", default-features = false, features = ["config-json"] }

[dependencies]
tauri = { version = "=2.11.5", default-features = false, features = ["wry", "compression"] }
tauri-plugin-updater = { version = "=2.10.1", default-features = false, features = ["rustls-tls", "zip"] }
tauri-plugin-opener = { version = "=2.5.4", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync"] }

[profile.release]
opt-level = 1
debug = 0
strip = "debuginfo"
lto = false
codegen-units = 16
incremental = true
