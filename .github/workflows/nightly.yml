name: Nightly Build

on:
  schedule:
    # Weekdays at 02:00 UTC
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build and upload the selected packages without publishing them."
        required: false
        default: false
        type: boolean
      all_platforms:
        description: "Build Windows x64, Linux x64/arm64, and macOS x64/arm64 desktop packages."
        required: false
        default: false
        type: boolean
      artifact_retention_days:
        description: "Retention for build artifacts."
        required: false
        default: 7
        type: number
      reuse_run_id:
        description: "Successful main-branch Nightly Build run whose Windows artifact should be published without rebuilding."
        required: false
        type: string
      reuse_version:
        description: "Original full nightly version for reuse_run_id, including +commit metadata."
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: nightly-${{ github.repository }}
  cancel-in-progress: true

env:
  NIGHTLY_TAG: nightly

jobs:
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      nightly_version: ${{ steps.check.outputs.nightly_version }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      source_run_id: ${{ steps.check.outputs.source_run_id }}
      artifact_id: ${{ steps.check.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve Windows nightly source
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          REUSE_VERSION: ${{ inputs.reuse_version }}
          ALL_PLATFORMS: ${{ inputs.all_platforms }}
        run: |
          set -euo pipefail

          if [[ "${ALL_PLATFORMS}" == "true" && -n "${REUSE_RUN_ID}" ]]; then
            echo "Windows artifact reuse cannot supply an all-platform build." >&2
            exit 1
          fi

          if [[ -n "${REUSE_RUN_ID}" ]]; then
            [[ "${REUSE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REUSE_RUN_ID}" > nightly-source-run.json
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REUSE_RUN_ID}/artifacts?per_page=100" > nightly-source-artifacts.json
            source_sha="$(jq -r '.head_sha' nightly-source-run.json)"
            [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "${source_sha}" origin/main
            git show "${source_sha}:package.json" > nightly-source-package.json
            node scripts/resolve-reused-windows-nightly.mjs
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${REUSE_VERSION}" ]]; then
            echo "reuse_version requires reuse_run_id." >&2
            exit 1
          fi

          BASE_VERSION="$(jq -r '.version' package.json)"
          DATE_SUFFIX="$(date -u '+%Y%m%d')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.${DATE_SUFFIX}+${SHORT_SHA}"
          echo "nightly_version=$NIGHTLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact_id=" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_COMMIT_TIME="$(git log -1 --format='%ct')"
          NOW="$(date -u '+%s')"
          HOURS_AGO=$(( (NOW - LAST_COMMIT_TIME) / 3600 ))
          if [[ "$HOURS_AGO" -lt 25 ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits in the last 25 hours, skipping nightly build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-artifacts:
    name: Build Nightly Artifacts
    needs: check-changes
    if: >-
      needs.check-changes.outputs.should_build == 'true' &&
      needs.check-changes.outputs.artifact_id == ''
    uses: ./.github/workflows/nightly-artifacts.yml
    permissions:
      contents: read
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    with:
      checkout_ref: ${{ needs.check-changes.outputs.source_sha }}
      version: ${{ needs.check-changes.outputs.nightly_version }}
      artifact_prefix: nightly
      artifact_retention_days: ${{ fromJSON(inputs.artifact_retention_days || '7') }}
      build_desktop_packages: true
      desktop_platforms: ${{ inputs.all_platforms && '["windows-x64","linux-x64","linux-arm64","macos-arm64","macos-x64"]' || '["windows-x64"]' }}
      build_linux_binaries: false
      build_relay_image: false
      upload_artifacts: true
      cache_write: ${{ github.repository_owner == 'GCWing' }}

  publish-nightly:
    name: Publish Nightly
    needs: [check-changes, build-artifacts]
    if: >-
      always() && !cancelled() &&
      needs.check-changes.result == 'success' &&
      needs.check-changes.outputs.should_build == 'true' &&
      inputs.build_only != true &&
      (needs.build-artifacts.result == 'success' ||
       (needs.build-artifacts.result == 'skipped' &&
        needs.check-changes.outputs.artifact_id != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ needs.check-changes.outputs.source_sha }}
      SOURCE_RUN_ID: ${{ needs.check-changes.outputs.source_run_id }}
      NIGHTLY_VERSION: ${{ needs.check-changes.outputs.nightly_version }}
      PACKAGE_SCOPE: ${{ inputs.all_platforms && 'Windows, Linux and macOS' || 'Windows' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Windows artifact from this run
        if: needs.check-changes.outputs.artifact_id == ''
        uses: actions/download-artifact@v7
        with:
          name: openbitfun-nightly-windows-x64-bundle
          path: release-assets

      - name: Download validated Windows artifact from the successful run
        if: needs.check-changes.outputs.artifact_id != ''
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.check-changes.outputs.artifact_id }}
          run-id: ${{ needs.check-changes.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Prepare versioned Windows installer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-windows-installer-asset.mjs \
            --assets-dir release-assets \
            --version "${NIGHTLY_VERSION%%+*}" \
            --out-dir release-manual-assets
          test -s "release-manual-assets/OpenBitFun_${NIGHTLY_VERSION%%+*}_windows-x86_64-installer.exe"
          node scripts/resolve-reused-windows-nightly.mjs --verify-installer \
            "release-manual-assets/OpenBitFun_${NIGHTLY_VERSION%%+*}_windows-x86_64-installer.exe" "$NIGHTLY_VERSION"
          (cd release-manual-assets && sha256sum *.exe > "OpenBitFun_${NIGHTLY_VERSION%%+*}_windows-x86_64-installer.exe.sha256")

      - name: Download all desktop platform artifacts
        if: inputs.all_platforms == true
        uses: actions/download-artifact@v7
        with:
          pattern: openbitfun-nightly-*-bundle
          path: desktop-release-assets

      - name: Stage Linux and macOS installers
        if: inputs.all_platforms == true
        run: node scripts/stage-nightly-desktop-assets.mjs desktop-release-assets release-manual-assets

      - name: Sign installer packages
        shell: bash
        env:
          OPENBITFUN_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OPENBITFUN_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENBITFUN_SIGNING_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-manual-assets -type f ! -name '*.sig' | sort)
          bash scripts/sign-release-assets.sh "${assets[@]}"
          test -s "release-manual-assets/OpenBitFun_${NIGHTLY_VERSION%%+*}_windows-x86_64-installer.exe.sig"
          test -s "release-manual-assets/OpenBitFun_${NIGHTLY_VERSION%%+*}_windows-x86_64-installer.exe.sha256.sig"
          node scripts/write-minisign-public-key.mjs --out release-manual-assets/minisign.pub

      - name: Publish Windows nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_sha="$(git ls-remote origin "refs/tags/${NIGHTLY_TAG}" | cut -f1)"
          if [[ "${previous_sha}" != "${SOURCE_SHA}" ]]; then
            git tag --force "${NIGHTLY_TAG}" "${SOURCE_SHA}"
            if ! git push --force-with-lease="refs/tags/${NIGHTLY_TAG}:${previous_sha}" \
              origin "refs/tags/${NIGHTLY_TAG}"; then
              echo "Could not update nightly. Historical workflow revisions may require pre-pushing the source tag with an authenticated client that has workflow permissions." >&2
              exit 1
            fi
          fi

          cat > nightly-release-notes.md <<EOF
          ${PACKAGE_SCOPE:-Windows} nightly packages from main.

          **Version**: ${NIGHTLY_VERSION}
          **Source commit**: ${SOURCE_SHA}
          **Build run**: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}

          Each installer is accompanied by its SHA-256 checksum and detached minisign signatures.
          EOF
          # The tag lookup endpoint omits draft releases. Include drafts so a
          # retry resumes the same release after staging or a partial upload.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --paginate --slurp > nightly-release-pages.json
          release_count="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const releases = JSON.parse(readFileSync("nightly-release-pages.json", "utf8")).flat();
            console.log(releases.filter(release => release.tag_name === process.env.NIGHTLY_TAG).length);
          ')"
          case "${release_count}" in
            1) gh release edit "${NIGHTLY_TAG}" --repo "${GITHUB_REPOSITORY}" --draft ;;
            0) gh release create "${NIGHTLY_TAG}" --repo "${GITHUB_REPOSITORY}" \
                   --verify-tag --draft --title "Nightly ${PACKAGE_SCOPE:-Windows} Build (${NIGHTLY_VERSION})" \
                   --notes-file nightly-release-notes.md ;;
            *) echo "Expected at most one release for nightly." >&2; exit 1 ;;
          esac
          gh release upload "${NIGHTLY_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --clobber release-manual-assets/*
          release_id="$(gh release view "${NIGHTLY_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json uploadUrl --jq '.uploadUrl | split("/")[-2]')"
          [[ "${release_id}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > nightly-release-state.json
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            const expected = new Set(readdirSync("release-manual-assets"));
            const release = JSON.parse(readFileSync("nightly-release-state.json", "utf8"));
            for (const asset of release.assets) {
              if (!expected.has(asset.name)) console.log(asset.id);
            }
          ' > nightly-obsolete-asset-ids.txt
          while IFS= read -r asset_id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done < nightly-obsolete-asset-ids.txt
          gh release edit "${NIGHTLY_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --draft=false --prerelease --latest=false \
            --title "Nightly ${PACKAGE_SCOPE:-Windows} Build (${NIGHTLY_VERSION})" \
            --notes-file nightly-release-notes.md

      - name: Verify published Windows installer and signatures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${NIGHTLY_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --dir published-windows-assets --pattern '*.exe' --pattern '*.exe.sig' \
            --pattern '*.exe.sha256' --pattern '*.exe.sha256.sig' --pattern minisign.pub
          for asset in release-manual-assets/*.exe release-manual-assets/*.exe.sig \
            release-manual-assets/*.exe.sha256 release-manual-assets/*.exe.sha256.sig release-manual-assets/minisign.pub; do
            cmp "${asset}" "published-windows-assets/$(basename "${asset}")"
          done
          (cd published-windows-assets && sha256sum --check *.sha256)
          installer="published-windows-assets/OpenBitFun_${NIGHTLY_VERSION%%+*}_windows-x86_64-installer.exe"
          for asset in "${installer}" "${installer}.sha256"; do
            base64 -d "${asset}.sig" > "${asset}.minisig"
            minisign -Vm "${asset}" -p published-windows-assets/minisign.pub -x "${asset}.minisig"
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${NIGHTLY_TAG}" --jq .object.sha)" = "${SOURCE_SHA}"

      - name: Verify published Linux and macOS installers
        if: inputs.all_platforms == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${NIGHTLY_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --dir published-desktop-assets --clobber
          for asset in release-manual-assets/*; do
            cmp "${asset}" "published-desktop-assets/$(basename "${asset}")"
          done
          (cd published-desktop-assets && sha256sum --check *.sha256)
          for signature in published-desktop-assets/*.sig; do
            base64 -d "${signature}" > "${signature}.minisig"
            minisign -Vm "${signature%.sig}" -p published-desktop-assets/minisign.pub -x "${signature}.minisig"
          done
